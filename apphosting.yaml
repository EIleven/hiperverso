# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 10 # Explicitly set to be within quota
  # concurrency: 80
  cpu: 1 # Explicitly set to 1 CPU (1000mCPU)
  memoryMiB: 1024

  # Variaveis de ambiente. Segredos entram so por referencia ao Secret Manager (nunca valores aqui).
env:
  # Config web PUBLICA do Firebase (nao e segredo); NEXT_PUBLIC_* precisa existir no BUILD.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBXSAlqJTSCMh8ZMpWXsEugsyKMxxnEaNU
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: echo-b5aw9.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: echo-b5aw9
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: echo-b5aw9.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "710006061811"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:710006061811:web:df663fac45b2851c379586
    availability:
      - BUILD
      - RUNTIME
  # Chave publica score-based do reCAPTCHA Enterprise, registrada no App Check para o cliente Web acima.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6Le2mP8tAAAAAIYWrlKxMj5Wsn_J_cagV6a9jRnY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: echo-db-124325
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FUNCTIONS_REGION
    value: southamerica-east1
    availability:
      - BUILD
      - RUNTIME
  # Página /download oferece o APK de public/downloads/latest.json (app Android fora da Play Store).
  - variable: NEXT_PUBLIC_APK_DOWNLOAD_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: ATPROTO_PRIVATE_JWK
    secret: ATPROTO_PRIVATE_JWK
    availability:
      - RUNTIME
  # Mesmo segredo usado por onPostCreated para revalidar sitemap e páginas de posts.
  # O valor fica no Secret Manager e nunca no repositório ou nos logs de build.
  - variable: REVALIDATE_SECRET
    secret: REVALIDATE_TOKEN
    availability:
      - RUNTIME
  - variable: REVALIDATE_TOKEN
    secret: REVALIDATE_TOKEN
  - variable: AP_MASTER_KEY
    secret: AP_MASTER_KEY
    availability:
      - RUNTIME
  - variable: AP_SCHEDULER_SA
    value: 710006061811-compute@developer.gserviceaccount.com
    availability:
      - RUNTIME
  # Envio transacional proprio (verificacao de conta e redefinicao de senha) via Resend SMTP.
  - variable: SMTP_HOST
    value: smtp.resend.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: SMTP_SECURE
    value: "true"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: resend
    availability:
      - RUNTIME
  - variable: SMTP_PASS
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: SMTP_FROM
    value: "HiperVerso <HiperVerso@hiperverso.app>"
    availability:
      - RUNTIME
